<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>回到花园 · Focus Garden</title>
<style>
:root{color-scheme:light dark;--paper:#f6f4ec;--ink:#263a30;--muted:#738073;--line:#d8ded0;--green:#3d6b49}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;display:grid;place-items:center;padding:32px}main{max-width:620px;width:100%}.mark{font-size:14px;letter-spacing:.12em;color:var(--green)}.plant{font-size:64px;margin:35px 0 20px}h1{font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1.3;margin:0 0 24px}p{color:var(--muted)}.rule{padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:28px 0;overflow-wrap:anywhere}.rule b{color:var(--ink)}label{display:block;font-size:13px;color:var(--muted);margin-top:28px}input{width:100%;margin:8px 0 12px;padding:13px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit}button{border:0;border-radius:8px;background:var(--green);color:white;padding:11px 18px;font:inherit;cursor:pointer;margin-right:8px}.secondary{background:transparent;color:var(--green);border:1px solid var(--line)}small{display:block;color:var(--muted);margin-top:20px}.status{min-height:1.7em;font-size:13px}@media(prefers-color-scheme:dark){:root{--paper:#1e2923;--ink:#e4ecde;--muted:#a6b5a5;--line:#3a4c3f;--green:#76a77b}button{color:#142018}}
</style></head><body><main><div class="mark">FOCUS GARDEN / 专注花园</div><div class="plant" aria-hidden="true">🌱</div><h1>把这一刻，<br>留给正在生长的事。</h1><p>这次分心已经接住了。完成手上的一小步，就是今天的一次进步。</p><div class="rule"><b id="target">当前网站</b><br><span id="rule"></span></div><p>当前标签已切换到这张本地提示页。其他标签、浏览器和文件都还在，你可以直接打开需要的网站。</p><label for="destination">前往工作所需的网址</label><input id="destination" placeholder="https://…" inputmode="url"><button id="go">打开网址</button><button id="copy" class="secondary">复制原地址</button><p id="status" class="status" role="status"></p><small>本页由这台 Mac 上的 Focus Garden 生成。没有联网，也没有上传浏览记录。返回仍受限制的网站时会再次显示提示。</small></main>
<script>
const params=new URLSearchParams(location.hash.slice(1));
document.getElementById('target').textContent=params.get('target')||'当前网站';
document.getElementById('rule').textContent='生效名单 · '+(params.get('list')||'专注限制');
const status=document.getElementById('status');
document.getElementById('go').onclick=()=>{try{const raw=document.getElementById('destination').value.trim();if(!raw)throw Error();const url=new URL(raw.includes('://')?raw:'https://'+raw);if(!['http:','https:'].includes(url.protocol))throw Error();location.assign(url.href)}catch{status.textContent='请填写有效的 http 或 https 网站地址。'}};
document.getElementById('destination').onkeydown=e=>{if(e.key==='Enter')document.getElementById('go').click()};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(params.get('original')||'');status.textContent='原地址已复制。'}catch{const field=document.getElementById('destination');field.value=params.get('original')||'';field.select();status.textContent='原地址已选中，可以按 ⌘C 复制。'}};
</script></body></html>
